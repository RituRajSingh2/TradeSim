# ============================================================
# TradeSim — CI Pipeline
#
# Triggers:
#   - push to main / develop
#   - all pull requests targeting main / develop
#
# Jobs (run in parallel where possible):
#   1. lint       — ESLint across all workspaces
#   2. typecheck  — tsc --noEmit across all workspaces
#   3. test       — Unit / integration tests across all workspaces
#   4. build      — Full production build (api, web, shared)
#   5. audit      — pnpm audit for dependency vulnerabilities
#
# All jobs share a pnpm + Turbo cache layer for fast reruns.
# Broken typechecks and build errors fail the pipeline immediately.
# Lint warnings do NOT fail CI (--max-warnings=0 is set per-package
# but enforced only after the team establishes a clean baseline).
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'
  # Turbo remote cache is disabled — local cache only in CI
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ──────────────────────────────────────────────
  # Shared setup — install deps, warm Turbo cache
  # ──────────────────────────────────────────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache node_modules across all CI jobs in this workflow run.
      # Key includes lockfile hash so cache busts on any dep change.
      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ──────────────────────────────────────────────
  # Typecheck — must pass; blocks merge on failure
  # ──────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm --filter @tradesim/api prisma generate

      - name: Type check all packages
        run: pnpm turbo run typecheck

  # ──────────────────────────────────────────────
  # Lint — warnings are captured but don't block CI
  # (max-warnings=0 can be tightened once baseline is clean)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm --filter @tradesim/api prisma generate

      - name: Lint all packages
        run: pnpm turbo run lint
        # Lint failures surface as annotations in the PR but only block
        # merge once the --max-warnings=0 flag is enforced per package.
        continue-on-error: false

  # ──────────────────────────────────────────────
  # Test
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm --filter @tradesim/api prisma generate

      - name: Run tests
        run: pnpm turbo run test

  # ──────────────────────────────────────────────
  # Build — must pass; blocks merge on failure
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm --filter @tradesim/api prisma generate

      - name: Build all packages
        env:
          # Enable Next.js standalone output on Linux CI runners.
          # Windows local builds must NOT set this (EPERM symlink restriction).
          NEXT_OUTPUT_STANDALONE: 'true'
        run: pnpm turbo run build

      # Save Turbo cache after a successful build so subsequent jobs
      # (and the next workflow run) can replay unchanged tasks.
      - name: Save Turbo cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # ──────────────────────────────────────────────
  # Dependency security audit
  # High/critical vulnerabilities fail the pipeline.
  # ──────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/api/node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Audit dependencies
        # --audit-level=high fails only on high/critical CVEs.
        # Moderate/low advisories are reported but do not block CI.
        run: pnpm audit --audit-level=high
        continue-on-error: true   # Surface as annotation; tighten once baseline is clean
