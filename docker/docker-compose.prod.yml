# ============================================================
# docker-compose.prod.yml — Production stack
#
# Services:
#   postgres  — PostgreSQL 16 with health check
#   redis     — Redis 7 with AOF persistence + health check
#   api       — NestJS API (built from Dockerfile.api)
#   web       — Next.js standalone (built from Dockerfile.web)
#
# Usage:
#   docker compose -f docker/docker-compose.prod.yml \
#     --env-file .env.production up -d
#
# Required environment file (.env.production):
#   See .env.production.example for all required variables.
# ============================================================

version: '3.8'

networks:
  tradesim:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tradesim-postgres
    restart: unless-stopped
    networks: [tradesim]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-tradesim}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradesim}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Do NOT expose 5432 externally in production
    expose: ['5432']

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tradesim-redis
    restart: unless-stopped
    networks: [tradesim]
    # AOF persistence: survive crashes, avoid cold-cache storms on restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose: ['6379']

  # ── API (NestJS) ──────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: tradesim-api:latest
    container_name: tradesim-api
    restart: unless-stopped
    networks: [tradesim]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              3001
      # Database — constructed from compose vars for security
      DATABASE_URL:      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradesim}?schema=public
      # Redis — constructed from compose vars
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      # JWT — must be injected at runtime, never baked into image
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRATION:    ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      # CORS
      CORS_ORIGIN:       ${CORS_ORIGIN:-http://localhost:3000}
      # Firebase (optional)
      FIREBASE_PROJECT_ID:   ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY:  ${FIREBASE_PRIVATE_KEY:-}
      # Razorpay (optional)
      RAZORPAY_KEY_ID:    ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Tuning
      MARKET_DATA_POLL_INTERVAL_MS: ${MARKET_DATA_POLL_INTERVAL_MS:-5000}
      THROTTLE_TTL:   ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health/live || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Web (Next.js) ─────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL:              ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_WS_URL:               ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
        NEXT_PUBLIC_FIREBASE_API_KEY:     ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID:  ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID:      ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID:      ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    image: tradesim-web:latest
    container_name: tradesim-web
    restart: unless-stopped
    networks: [tradesim]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT:     3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
